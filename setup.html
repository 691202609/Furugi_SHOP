<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>First Admin Setup | Furugi SHOP</title><link rel="stylesheet" href="admin.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:24px"><section class="panel" style="width:min(560px,100%)"><div class="admin-brand"><span>古</span><span>FURUGI SHOP<small>ONE-TIME CLOUD SETUP</small></span></div><h1 style="margin-top:28px">สร้าง Admin คนแรก</h1><p class="muted">หน้านี้ใช้ได้เฉพาะก่อนมี Admin คนแรก เมื่อสร้างสำเร็จระบบจะปิดการ Setup อัตโนมัติ</p><div id="setupState" class="notice">กำลังตรวจสอบระบบ...</div><form id="setupForm" hidden><div class="field"><label>Setup Token</label><input type="password" name="setupToken" autocomplete="off" required></div><div class="field"><label>ชื่อ Admin</label><input name="name" value="Furugi Admin" required></div><div class="field"><label>Email</label><input type="email" name="email" autocomplete="email" required></div><div class="field"><label>Password</label><input type="password" name="password" minlength="12" autocomplete="new-password" required><small class="muted">อย่างน้อย 12 ตัว มีตัวอักษร ตัวเลข และอักขระพิเศษ</small></div><button class="btn btn-pink" type="submit" style="width:100%;margin-top:16px">CREATE FIRST ADMIN →</button></form><div class="actions" style="margin-top:18px"><a class="btn" href="admin-login.html">ADMIN LOGIN</a><a class="btn" href="index.html">OPEN STORE</a></div></section></main><div id="adminToast" class="toast"></div><script src="setup.js"></script></body></html>
